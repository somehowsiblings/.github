# 재사용 워크플로: JDK 21 + Gradle 빌드. 호출 예시
#   jobs:
#     build:
#       uses: somehowsiblings/.github/.github/workflows/gradle-ci.yml@main
#       with:
#         working-directory: server   # 생략하면 저장소 루트
name: gradle-ci
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
      java-version:
        type: string
        required: false
        default: "21"
      gradle-args:
        type: string
        required: false
        default: "build"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ inputs.gradle-args }} --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ inputs.working-directory }}/**/build/reports/**
          if-no-files-found: ignore
